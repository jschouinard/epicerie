<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 Liste d'épicerie</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e8f5e9;
    color: #1b3a1e;
    line-height: 1.45;
    padding: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 18px; }
  h1 { color: #1b5e20; font-size: 1.7rem; }
  .sub { color: #2e7d32; font-size: .9rem; margin-top: 6px; }
  .sub strong { color: #1b5e20; }

  .progress-box { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .progress-label { font-size: .85rem; color: #2e7d32; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .bar { background: #e8f5e9; border-radius: 8px; height: 16px; overflow: hidden; }
  .bar-fill { background: linear-gradient(90deg,#2e7d32,#1b5e20); height: 100%; width: 0%; transition: width .3s; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .toolbar button {
    flex: 1 1 auto; min-width: 120px; background: #2e7d32; color: #fff; border: none;
    padding: 10px 12px; border-radius: 8px; font-size: .85rem; cursor: pointer; font-weight: 600;
  }
  .toolbar button:hover { background: #1b5e20; }

  .section-title { color: #1b5e20; font-size: 1.05rem; margin: 22px 0 10px; font-weight: 700; }

  .recipe-card { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07); display: flex; align-items: center; gap: 10px; }
  .recipe-card.removed { opacity: .55; background: #f1f1f1; }
  .recipe-info { flex: 1; min-width: 0; }
  .recipe-name { font-weight: 600; font-size: .95rem; color: #1b3a1e; }
  .recipe-card.removed .recipe-name { text-decoration: line-through; }
  .recipe-meta { font-size: .78rem; color: #6b8e6e; margin-top: 2px; }
  .recipe-meta a { color: #2e7d32; text-decoration: none; }
  .recipe-meta a:hover { text-decoration: underline; }
  .recipe-btn { border: none; border-radius: 7px; padding: 8px 10px; font-size: .78rem;
    cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn-remove { background: #ffe0e0; color: #b3261e; }
  .btn-remove:hover { background: #ffc9c9; }
  .btn-restore { background: #2e7d32; color: #fff; }
  .btn-restore:hover { background: #1b5e20; }

  .category { background: #fff; border-radius: 10px; margin-bottom: 10px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .cat-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer;
    background: #f1f8f2; user-select: none; }
  .cat-header:hover { background: #e8f5e9; }
  .cat-emoji { font-size: 1.15rem; }
  .cat-name { font-weight: 700; color: #1b5e20; flex: 1; font-size: .98rem; }
  .cat-count { background: #2e7d32; color: #fff; border-radius: 12px; font-size: .72rem;
    padding: 2px 9px; font-weight: 600; }
  .cat-chevron { color: #2e7d32; font-size: .8rem; transition: transform .2s; }
  .category.collapsed .cat-chevron { transform: rotate(-90deg); }
  .category.collapsed .cat-body { display: none; }
  .category.empty .cat-header { opacity: .5; }
  .category.empty .cat-count { background: #9e9e9e; }

  .cat-body { padding: 4px 0 8px; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; border-top: 1px solid #f0f0f0; }
  .item:first-child { border-top: none; }
  .item input[type=checkbox] { width: 20px; height: 20px; margin-top: 1px; accent-color: #2e7d32;
    cursor: pointer; flex-shrink: 0; }
  .item-text { flex: 1; min-width: 0; }
  .item-name { font-size: .92rem; }
  .item.checked .item-name { text-decoration: line-through; color: #9e9e9e; }
  .item-qty { color: #2e7d32; font-weight: 600; font-size: .82rem; }
  .item.checked .item-qty { color: #bdbdbd; }
  .item-recipes { font-size: .76rem; color: #88a98b; font-style: italic; margin-top: 1px; }
  .item-manual-tag { font-size: .72rem; color: #b9821a; font-style: italic; margin-top: 1px; }
  .item-del { background: none; border: none; color: #c0392b; cursor: pointer; font-size: .9rem;
    padding: 2px 6px; flex-shrink: 0; }

  .add-row { display: flex; gap: 6px; padding: 10px 14px 4px; }
  .add-row input { flex: 1; border: 1px solid #cfe3d0; border-radius: 7px; padding: 8px 10px;
    font-size: .85rem; }
  .add-row input:focus { outline: 2px solid #2e7d32; }
  .add-row button { background: #2e7d32; color: #fff; border: none; border-radius: 7px;
    padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .85rem; }
  .add-row button:hover { background: #1b5e20; }

  footer { text-align: center; color: #6b8e6e; font-size: .75rem; margin-top: 24px; }
</style>
</head>

/* ===================== ÉTAT (mémoire JS) ===================== */
const removedRecipes = {};   // recipeId -> true
const checkedState = {};     // itemId -> true
const manualItems = {};      // categoryIndex -> [{id,name,checked}]
let manualCounter = 0;

function slug(s){
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
/* IDs stables basés sur catégorie + nom */
categories.forEach((cat,ci)=>{
  manualItems[ci] = [];
  cat.items.forEach(it=>{
    it.id = 'i-'+slug(cat.name)+'__'+slug(it.name);
    if(!it.recettes) it.recettes = [];
  });
});

/* ===================== LOGIQUE ===================== */
function activeRecettes(it){ return it.recettes.filter(r=>!removedRecipes[r]); }
function itemVisible(cat,it){
  if(cat.fixed) return true;
  if(it.recettes.length===0) return true;
  return activeRecettes(it).length>0;
}
function recipeById(id){ return recipes.find(r=>r.id===id); }

/* ===================== RENDU ===================== */
function renderSubtitle(){
  const active = recipes.filter(r=>!removedRecipes[r.id]).length;
  let items=0;
  categories.forEach((cat,ci)=>{
    cat.items.forEach(it=>{ if(itemVisible(cat,it)) items++; });
    items += manualItems[ci].length;
  });
  document.getElementById('subtitle').innerHTML =
    '<strong>'+active+'</strong> recette'+(active>1?'s':'')+' active'+(active>1?'s':'')+
    ' · <strong>'+items+'</strong> items<br>Quantités ajustées : minimum 4 portions par recette';
}

function renderRecipes(){
  const c = document.getElementById('recipesContainer');
  c.innerHTML='';
  recipes.forEach(r=>{
    const removed = !!removedRecipes[r.id];
    const card = document.createElement('div');
    card.className = 'recipe-card'+(removed?' removed':'');
    card.innerHTML =
      '<div class="recipe-info">'+
        '<div class="recipe-name">'+r.name+'</div>'+
        '<div class="recipe-meta">'+r.portions+' · <a href="'+r.url+'" target="_blank" rel="noopener">'+r.source+' ↗</a></div>'+
      '</div>'+
      (removed
        ? '<button class="recipe-btn btn-restore" onclick="restoreRecipe(\''+r.id+'\')">↺ Restaurer</button>'
        : '<button class="recipe-btn btn-remove" onclick="removeRecipe(\''+r.id+'\')">✕ Retirer</button>');
    c.appendChild(card);
  });
}

function renderCategories(){
  const c = document.getElementById('categoriesContainer');
  c.innerHTML='';
  categories.forEach((cat,ci)=>{
    const visItems = cat.items.filter(it=>itemVisible(cat,it));
    const count = visItems.length + manualItems[ci].length;
    const div = document.createElement('div');
    div.className = 'category'+(cat.collapsed?' collapsed':'')+(count===0?' empty':'');

    let body = '<div class="cat-body">';
    visItems.forEach(it=>{ body += renderItem(it); });
    manualItems[ci].forEach(mi=>{ body += renderManualItem(ci,mi); });
    body += '<div class="add-row">'+
      '<input type="text" id="addInput-'+ci+'" placeholder="+ Ajouter un item…" '+
      'onkeydown="if(event.key===\'Enter\')addManual('+ci+')">'+
      '<button onclick="addManual('+ci+')">Ajouter</button>'+
    '</div></div>';

    div.innerHTML =
      '<div class="cat-header" onclick="toggleCat('+ci+')">'+
        '<span class="cat-emoji">'+cat.emoji+'</span>'+
        '<span class="cat-name">'+cat.name+'</span>'+
        '<span class="cat-count">'+count+'</span>'+
        '<span class="cat-chevron">▼</span>'+
      '</div>'+ body;
    c.appendChild(div);
  });
}

function renderItem(it){
  const checked = !!checkedState[it.id];
  const act = activeRecettes(it).map(rid=>recipeById(rid).short);
  let sub='';
  if(act.length) sub = '<div class="item-recipes">'+act.join(' · ')+'</div>';
  const qty = it.qty ? '<span class="item-qty">'+it.qty+'</span> ' : '';
  return '<div class="item'+(checked?' checked':'')+'">'+
    '<input type="checkbox" '+(checked?'checked':'')+' onchange="toggleItem(\''+it.id+'\')">'+
    '<div class="item-text"><div class="item-name">'+qty+it.name+'</div>'+sub+'</div>'+
  '</div>';
}

function renderManualItem(ci,mi){
  const checked = !!mi.checked;
  return '<div class="item'+(checked?' checked':'')+'">'+
    '<input type="checkbox" '+(checked?'checked':'')+' onchange="toggleManual('+ci+',\''+mi.id+'\')">'+
    '<div class="item-text"><div class="item-name">'+escapeHtml(mi.name)+'</div>'+
      '<div class="item-manual-tag">✏️ Ajouté manuellement</div></div>'+
    '<button class="item-del" onclick="deleteManual('+ci+',\''+mi.id+'\')" title="Supprimer">✕</button>'+
  '</div>';
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderProgress(){
  let total=0, done=0;
  categories.forEach((cat,ci)=>{
    cat.items.forEach(it=>{
      if(itemVisible(cat,it)){ total++; if(checkedState[it.id]) done++; }
    });
    manualItems[ci].forEach(mi=>{ total++; if(mi.checked) done++; });
  });
  const pct = total? Math.round(done/total*100) : 0;
  document.getElementById('progressText').textContent = done+' / '+total+' items cochés';
  document.getElementById('progressPct').textContent = pct+' %';
  document.getElementById('barFill').style.width = pct+'%';
}

function renderAll(){ renderSubtitle(); renderRecipes(); renderCategories(); renderProgress(); }

/* ===================== ACTIONS ===================== */
function toggleItem(id){
  checkedState[id] = !checkedState[id];
  renderCategories(); renderProgress();
}
function toggleManual(ci,id){
  const mi = manualItems[ci].find(m=>m.id===id);
  if(mi){ mi.checked=!mi.checked; renderCategories(); renderProgress(); }
}
function deleteManual(ci,id){
  manualItems[ci] = manualItems[ci].filter(m=>m.id!==id);
  renderAll();
}
function addManual(ci){
  const inp = document.getElementById('addInput-'+ci);
  if(!inp) return;
  const val = inp.value.trim();
  if(!val) return;
  manualItems[ci].push({id:'m'+(++manualCounter), name:val, checked:false});
  if(categories[ci].collapsed) categories[ci].collapsed=false;
  renderAll();
  const newInp = document.getElementById('addInput-'+ci);
  if(newInp) newInp.focus();
}
function toggleCat(ci){
  categories[ci].collapsed = !categories[ci].collapsed;
  renderCategories();
}
let allCollapsed=false;
function toggleAll(){
  allCollapsed = !allCollapsed;
  categories.forEach(c=>c.collapsed=allCollapsed);
  renderCategories();
}
function uncheckAll(){
  for(const k in checkedState) delete checkedState[k];
  categories.forEach((cat,ci)=>manualItems[ci].forEach(mi=>mi.checked=false));
  renderCategories(); renderProgress();
}
function removeRecipe(id){
  const r = recipeById(id);
  if(!confirm('Retirer « '+r.name+' » ?\n\nLes ingrédients utilisés uniquement par cette recette seront retirés de la liste. Les ingrédients partagés resteront, sans l\'étiquette de cette recette.'))
    return;
  removedRecipes[id]=true;
  renderAll();
}
function restoreRecipe(id){
  delete removedRecipes[id];
  renderAll();
}
function copyList(){
  let txt='🛒 LISTE D\'ÉPICERIE\n';
  categories.forEach((cat,ci)=>{
    const vis = cat.items.filter(it=>itemVisible(cat,it));
    if(vis.length===0 && manualItems[ci].length===0) return;
    txt += '\n'+cat.emoji+' '+cat.name.toUpperCase()+'\n';
    vis.forEach(it=>{
      const box = checkedState[it.id]?'[x]':'[ ]';
      txt += box+' '+(it.qty?it.qty+' — ':'')+it.name+'\n';
    });
    manualItems[ci].forEach(mi=>{
      txt += (mi.checked?'[x]':'[ ]')+' '+mi.name+' (ajouté)\n';
    });
  });
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok=false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){},function(){});
  }
  alert(ok ? 'Liste copiée dans le presse-papiers ✓' : 'Liste prête — copiez le texte affiché.');
}

renderAll();
</script>
